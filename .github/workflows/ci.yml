
name: Testes automatizados - Lounge Tatuapé

on:
  push:
    branches: [main, revisao-tecnica]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r lounge-tatuape/requirements.txt
          pip install pytest pytest-cov

      - name: Executar testes e cobertura
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: chave-de-teste
          PYTHONPATH: lounge-tatuape
        run: python -m pytest --cov=app --cov-report=term-missing
